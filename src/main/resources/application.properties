spring.application.name=demo

# Đọc biến từ file .env ở thư mục gốc dự án (không có file thì bỏ qua)
# Biến môi trường thật của hệ điều hành sẽ được ưu tiên hơn .env
spring.config.import=optional:file:.env[.properties]

# Luôn bật màu cho log trên console
spring.output.ansi.enabled=always

# Cổng chạy server (mặc định 8080 nếu bỏ dòng này)
server.port=8080

# Log ra console/file bằng UTF-8 để hiển thị tiếng Việt
logging.charset.console=UTF-8
logging.charset.file=UTF-8

# JSON vào/ra API dùng snake_case (createdAt -> created_at)
spring.jackson.property-naming-strategy=SNAKE_CASE

# ===== Kết nối MySQL =====
# Giá trị thật đặt trong file .env (xem mẫu ở .env.example)
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

# ===== JPA / Hibernate =====
# validate: chỉ kiểm tra schema khớp Entity, việc sửa schema do Flyway đảm nhiệm
spring.jpa.hibernate.ddl-auto=validate
# In câu SQL ra console để dễ debug
spring.jpa.show-sql=true

# ===== Kết nối MongoDB =====
# Giá trị thật đặt trong file .env (xem mẫu ở .env.example)
spring.mongodb.uri=${MONGODB_URI}

# ===== JWT =====
# Khóa ký đặt trong file .env, tối thiểu 32 byte
jwt.secret=${JWT_SECRET}
jwt.access-token-ttl=1d
jwt.refresh-token-ttl=7d

# ===== Firebase Cloud Messaging =====
# Đường dẫn file service account đặt trong file .env
firebase.credentials-path=${FIREBASE_CREDENTIALS_PATH}

# ===== Upload ảnh =====
# Thư mục lưu file trên server, đường dẫn tương đối tính từ nơi chạy app
upload.dir=uploads
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=6MB