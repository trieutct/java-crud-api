spring.application.name=demo

# Đọc biến từ file .env ở thư mục gốc dự án (không có file thì bỏ qua)
# Biến môi trường thật của hệ điều hành sẽ được ưu tiên hơn .env
spring.config.import=optional:file:.env[.properties]

# Luôn bật màu cho log trên console
spring.output.ansi.enabled=always

# Cổng chạy server (mặc định 8080 nếu bỏ dòng này)
server.port=8080

# Log ra console/file bằng UTF-8 để hiển thị tiếng Việt
logging.charset.console=UTF-8
logging.charset.file=UTF-8

# ===== Kết nối MySQL =====
# Giá trị thật đặt trong file .env (xem mẫu ở .env.example)
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

# ===== JPA / Hibernate =====
# update: tự tạo/cập nhật bảng theo Entity (chỉ nên dùng khi dev)
spring.jpa.hibernate.ddl-auto=update
# In câu SQL ra console để dễ debug
spring.jpa.show-sql=true

# ===== Kết nối MongoDB =====
# Giá trị thật đặt trong file .env (xem mẫu ở .env.example)
spring.mongodb.uri=${MONGODB_URI}